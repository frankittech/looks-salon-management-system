
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | Looks Salon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce4ec, #fff);
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #c2185b;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c2185b;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #c2185b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #880e4f;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #c2185b;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">LOOKS SALON</div>
    <p class="subtitle">Your beauty, our passion.</p>

    <h2>Create Your Account</h2>

    <form id="registerForm">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required
                   placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required
                   placeholder="e.g. 0712345678">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required
                   placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required
                   minlength="8"
                   placeholder="At least 8 characters">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required
                   minlength="8"
                   placeholder="Confirm your password">
        </div>

        <button type="submit" id="registerBtn">
            Create Account
        </button>

        <p class="message" id="message"></p>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Login here</a>
    </p>

    <a href="../index.html" class="back-link">
        Back to Looks Salon
    </a>

</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    const registerForm = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const registerBtn = document.getElementById('registerBtn');

    registerForm.addEventListener('submit', async function(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        message.style.color = 'red';

        if (password !== confirmPassword) {
            message.textContent = 'Passwords do not match.';
            return;
        }

        if (password.length < 8) {
            message.textContent = 'Password must have at least 8 characters.';
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating Account...';

        try {
            const response = await fetch(`${API_URL}/customer/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    name,
                    phone,
                    email,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Registration failed.');
            }

            message.style.color = 'green';
            message.textContent = 'Account created successfully! Redirecting to login...';

            registerForm.reset();

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1800);

        } catch (error) {
            message.style.color = 'red';
            message.textContent = error.message;

        } finally {
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    });
</script>

</body>
</html>
